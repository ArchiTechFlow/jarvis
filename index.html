<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2433">
<title>Jarvis TechFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
/* SISTEM VIZUAL — reguli fixe.
   Culori: navy = acțiune (singurul buton plin) · portocaliu = „te așteaptă” · verde/roșu/galben = doar stare (punct + text).
   Text: 3 mărimi (14 / 16 / 22) + cifra mare (40). Greutăți: 400 și 600.
   Butoane: 3 tipuri (plin, contur, text). Etichete: 1 tip. Carduri: 1 tip, fără umbră, fără carduri în carduri. */
:root{
  --bg:#f3f1ec;--card:#fbfaf7;--ink:#1b2433;--muted:#5b6473;--line:#d9d5ca;
  --navy:#1f3a5f;--on-navy:#fff;--attn:#b93c08;--ok:#1a6d43;--warn:#8a6100;--bad:#b3261e;--idle:#6b7280;
  --f-head:'Archivo',system-ui,sans-serif;--f-body:'Barlow',system-ui,sans-serif;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--r:12px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#12161d;--card:#1a202a;--ink:#e9ecf2;--muted:#9aa4b5;--line:#2b3444;
  --navy:#8fb4f0;--on-navy:#0f1620;--attn:#f0894a;--ok:#5cc890;--warn:#e3b95a;--bad:#f28b82;--idle:#9aa4b5}}
:root[data-theme=dark]{
  --bg:#12161d;--card:#1a202a;--ink:#e9ecf2;--muted:#9aa4b5;--line:#2b3444;
  --navy:#8fb4f0;--on-navy:#0f1620;--attn:#f0894a;--ok:#5cc890;--warn:#e3b95a;--bad:#f28b82;--idle:#9aa4b5}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);font-weight:700;margin:0;letter-spacing:-.01em}
h1{font-size:22px;line-height:1.2}
h2{font-size:16px}
.meta{color:var(--muted);font-size:14px}
.num{font-family:var(--f-head);font-weight:700;font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.f{fill:currentColor;stroke:none}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

/* ——— componente (una singură dată) ——— */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:44px;padding:0 var(--s4);border-radius:10px;border:1px solid var(--navy);background:var(--navy);color:var(--on-navy);font-weight:600;font-size:16px;cursor:pointer}
.btn.sec{background:transparent;color:var(--navy)}
.btn.txt{background:none;border-color:transparent;color:var(--muted);font-weight:400;padding:0 var(--s3)}
.btn.sm{min-height:40px;font-size:14px;padding:0 var(--s3)}
.btn:disabled{opacity:.5;cursor:default}
.btn:active:not(:disabled){transform:translateY(1px)}
.tag{display:inline-block;padding:0 var(--s2);border:1px solid var(--line);border-radius:6px;font-size:14px;color:var(--muted);white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--idle)}
.st.ok::before{background:var(--ok)}.st.warn::before{background:var(--warn)}.st.bad::before{background:var(--bad)}.st.attn::before{background:var(--attn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4)}
.card+.card,.stack>*+*{margin-top:var(--s2)}
.stack>.card,.grid>*{margin-top:0!important}.stack{display:grid;gap:var(--s2)}
.sec-t{display:flex;align-items:baseline;gap:var(--s2);margin:var(--s5) 0 var(--s2)}
.sec-t .c{color:var(--muted);font-size:14px;font-weight:400}
.sec-t .l{margin-left:auto}
.acts{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3)}
.acts.tx{margin-top:var(--s1);gap:0}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:var(--s4);color:var(--muted)}
input[type=text],input[type=email],input[type=password],textarea,select{width:100%;min-height:44px;padding:10px var(--s3);border-radius:10px;border:1px solid var(--line);background:var(--card)}
textarea{min-height:110px;resize:vertical}
select{appearance:auto;font-weight:600}
details.card>summary{cursor:pointer;list-style:none;display:flex;gap:var(--s3);align-items:flex-start}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary .grow{flex:1;min-width:0}
details.card>summary::after{content:"";width:9px;height:9px;margin:8px 4px 0 0;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);flex:none;transition:transform .15s}
details.card[open]>summary::after{transform:rotate(-135deg);margin-top:12px}
details.card[open]>summary .clip{display:none}
.card .t{font-weight:600}
.card pre,.card .body{white-space:pre-wrap;word-wrap:break-word;font:400 16px/1.5 var(--f-body);margin:var(--s3) 0 0;color:var(--ink)}
.seg{display:flex;gap:var(--s2);flex-wrap:wrap;margin:var(--s3) 0}
.seg button{min-height:40px;padding:0 var(--s3);border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.seg button.on{border-color:var(--navy);color:var(--navy);font-weight:600}

/* ——— structura paginii ——— */
#app{display:none}
#app.on{display:block}
#top{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--line);padding:var(--s2) var(--s4);padding-top:calc(var(--s2) + env(safe-area-inset-top))}
#top .r1{display:flex;align-items:center;gap:var(--s2);max-width:1200px;margin:0 auto}
#back{display:none}
#ctx{flex:1;min-width:0;max-width:460px}
#pulse{margin-left:auto}
#col{padding:var(--s4) var(--s4) 96px;max-width:1200px;margin:0 auto}
#head{margin:0 0 var(--s3)}
#head p{margin:var(--s1) 0 0}
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav#nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer}
nav#nav button.on{color:var(--navy);font-weight:600}
nav#nav button.on::before{content:"";position:absolute;top:0;left:20%;right:20%;height:3px;background:var(--navy);border-radius:0 0 3px 3px}
nav#nav .n{position:absolute;top:6px;left:calc(50% + 4px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--attn);color:#fff;font:700 12px/18px var(--f-head);text-align:center}
section{display:none}section.on{display:block}
@media(min-width:900px){
  #app.on{display:grid;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr}
  #top{grid-column:1/3}
  nav#nav{position:sticky;top:57px;align-self:start;height:calc(100dvh - 57px);grid-template-columns:1fr!important;grid-auto-rows:min-content;border-top:0;border-right:1px solid var(--line);padding:var(--s3)}
  nav#nav button{flex-direction:row;justify-content:flex-start;gap:var(--s3);min-height:44px;padding:0 var(--s3);border-radius:10px;font-size:16px}
  nav#nav button.on{background:var(--line);color:var(--ink)}nav#nav button.on::before{display:none}
  nav#nav .n{position:static;margin-left:auto}
  #col{padding:var(--s5) 32px 48px;margin:0;max-width:none;min-width:0}
  #col>*{max-width:1000px}
}
.grid{display:grid;gap:var(--s2)}
@media(min-width:900px){.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
.hero{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap}
.hero .big{font-size:40px;line-height:1}
.hero .big.attn{color:var(--attn)}
.hero .tx{flex:1;min-width:180px}
.pj{display:grid;grid-template-columns:1fr auto;gap:var(--s1) var(--s3);align-items:center;width:100%;text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3) var(--s4);min-height:64px}
.pj .t{font-weight:600;font-size:16px}
.pj .meta.w{grid-column:1/-1}
.ctxhead{display:flex;gap:var(--s3);align-items:flex-start;flex-wrap:wrap}
.ctxhead .grow{flex:1;min-width:220px}
.tl{position:relative;margin:0;padding:0;list-style:none}
.tl li{position:relative;padding:0 0 var(--s4) var(--s5)}
.tl li::before{content:"";position:absolute;left:5px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--line);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.tl li::after{content:"";position:absolute;left:9px;top:20px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.ad::before{background:var(--navy)}.tl li.jv::before{background:var(--ok)}
.tl .d{color:var(--muted);font-size:14px;margin:var(--s3) 0 var(--s2);font-weight:600}
.tl .d::before,.tl .d::after{display:none}
.tl li.dl{padding:0}.tl li.dl::before,.tl li.dl::after{display:none}
.lev{display:flex;align-items:center;gap:var(--s3);padding:10px 0;border-top:1px solid var(--line)}
.lev:first-child{border-top:0}
.lev .tick{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);color:transparent;flex:none}
.lev.y .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.lev .tick svg{width:13px;height:13px}
.lev span{flex:1}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.st9{display:grid;grid-template-columns:32px 1fr;gap:var(--s3);padding:0 0 var(--s4);position:relative}
.st9::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line)}
.st9:last-child::before{display:none}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--bg);font:700 14px var(--f-head);color:var(--muted)}
.st9.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.st9.partial .dot{border-color:var(--warn);color:var(--warn)}
.st9.now .dot{background:var(--attn);border-color:var(--attn);color:#fff}
.st9 .t{font-family:var(--f-head);font-weight:600}
.flow .fl{display:grid;grid-template-columns:32px 1fr;gap:var(--s3);position:relative;padding-bottom:var(--s4)}
.flow .fl::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line)}
.flow .fl:last-child::before{display:none}
.flow .fl .dot{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.flow .fl.you .dot{background:var(--attn);border-color:var(--attn);color:#fff}
.who{display:grid;gap:var(--s2);margin-top:var(--s2)}
.who button{display:flex;align-items:center;gap:var(--s3);text-align:left;padding:var(--s3);border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;min-height:48px}
.who button .num{font-size:22px;min-width:34px}
table.loc{width:100%;border-collapse:collapse;font-size:14px}
table.loc td{padding:var(--s2) var(--s2) var(--s2) 0;border-top:1px solid var(--line);vertical-align:top}
table.loc td:first-child{font-weight:600;white-space:nowrap;padding-right:var(--s4)}
table.loc td:last-child{color:var(--muted);word-break:break-word}
.chips{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3)}
.chips button{min-height:40px;padding:0 var(--s3);border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;text-align:left}
.ans{margin-top:var(--s3);padding:var(--s3);border-radius:10px;background:var(--bg);white-space:pre-wrap;word-wrap:break-word}
.toast{position:fixed;left:var(--s4);right:var(--s4);bottom:76px;z-index:9;background:var(--ink);color:var(--bg);padding:var(--s3) var(--s4);border-radius:10px;display:none}
@media(min-width:900px){.toast{left:auto;right:24px;bottom:24px;width:360px}}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);padding:0;width:min(640px,calc(100vw - 32px));max-height:85dvh}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dh{display:flex;align-items:center;gap:var(--s3);padding:var(--s4);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
dialog .dh h2{flex:1}
dialog .db{padding:var(--s4)}
#login{margin:12vh auto 0;width:min(340px,90vw);display:grid;gap:var(--s3)}
</style>
</head>

<div id="app">
  <div id="top"><div class="r1">
    <button class="btn sec sm" id="back" aria-label="Înapoi la Acasă">‹ Acasă</button>
    <select id="ctx" aria-label="Proiect"></select>

<script>
const db = supabase.createClient('https://bvobmlkeselbugvhfepu.supabase.co','sb_publishable_UbxkA9hsv9c-zHyBZEfNEg_cCcxgLFR',
  {auth:{persistSession:true,autoRefreshToken:true}});
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ora = d => new Date(d).toLocaleString('ro-RO',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const ls = (k,v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k,v); } catch {} };
const S = {inv:[],pct:[],dec:[],idei:[],cer:[],ap:[],msg:[],act:[],sar:[],uti:[],run:[],prj:[]};
let ctx='acasa', tab='acasa', fTip='toate', q='', qg='', fDec='deschise', pagina=30, notaK=null, draft='', rec=null;

  decis:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12l3 3 5-6"/>',avem:'<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>',

const EXPL = {
  agent:['Specialiști cărora le dai o lucrare întreagă.','Nu pornesc singuri: îi chemi tu („dă-i agentului financiar…”) sau îi alege coordonatorul. Cei 7: financiar, legal, vânzări, marketing, email, plus reviewer (recenzează munca altora fără să vadă discuția, ca să fie obiectiv) și verifier (verifică dovada, nu declarația). Șeful lor e skill-ul „coordonator”: el primește cererea și alege. Îi folosim când cererea e clar din domeniul lor; altfel lucrează Jarvis direct.'],

  hook:['Reguli care rulează singure, mereu, la un moment fix.','Nu depind de memoria nimănui: la pornirea sesiunii, la fiecare mesaj al tău, înainte să scrie peste un fișier, când vrea să spună „gata”. La noi: reinjectează regulile la fiecare tură, blochează suprascrierea unui fișier necitit și blochează „gata” fără o verificare rulată. De aceea Claude nu mai poate spune „merge” fără dovadă.'],

  done:['Făcut','ok'],todo:['De făcut',''],blocked:['Blocat','bad'],partial:['Parțial','warn'],asteapta:['Te așteaptă','attn'],aprobat:['Aprobat','ok'],respins:['Respins','bad']};
const st = s => { const [t,c] = STARE[s] || [s,'']; return `<span class="st ${c}">${esc(t)}</span>`; };
const cnt = (a,f) => a.filter(f).length;
const toast = m => { const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display='none',3500); };
const pj = id => S.prj.find(p=>p.id===id);
const pjn = id => pj(id)?.nume || (id||'Ecosistem');
const inC = id => ctx==='acasa' || (id||'ecosistem')===ctx;
const PCT = () => S.pct.filter(p=>!p.id.startsWith('E-'));
const ETP = () => S.pct.filter(p=>p.id.startsWith('E-')).sort((a,b)=>a.id.localeCompare(b.id));
const ultima = (tip,id) => S.act.find(a=>a.item_tip===tip&&a.item_id===id);
const util = (tip,nume) => S.uti.find(u=>u.tip===tip&&u.nume===nume.replace(/ \(.*\)/,''));
const runnerOn = () => { const r=S.run.find(x=>x.masina==='windows'); return r && (Date.now()-new Date(r.ultima))<60000 ? r : null; };
const ascuns = x => ['amana','respinge','aprob'].includes(ultima(x.tip,x.id)?.actiune);
const raspuns = c => { const m = S.msg.filter(x=>x.cerere_id===c.id&&x.autor==='jarvis').map(x=>x.text).join('\n\n'); return m || c.rezultat || ''; };
const cerP = c => c.interpretare?.proiect || 'ecosistem';
const titluC = c => { if (c.interpretare?.tip==='bilant') return 'Bilanț '+pjn(cerP(c)); const s=c.interpretare?.sarcina_id&&S.sar.find(x=>x.id===c.interpretare.sarcina_id); return s ? s.titlu : c.sursa==='buton' ? c.text_brut.split('\n')[0].slice(0,120) : c.text_brut.slice(0,200); };
const sursaC = c => c.interpretare?.mod==='autonom' ? 'făcut singur' : c.sursa==='buton' ? 'din buton' : 'scris de tine';
const sumar = t => (t||'').replace(/[*`#>]/g,'').replace(/\s+/g,' ').trim().slice(0,220);
const apP = a => cerP(S.cer.find(c=>c.id===a.cerere_id) || {});
const zi = d => { const x=new Date(d), t=new Date(); const dz=Math.floor((new Date(t.getFullYear(),t.getMonth(),t.getDate())-new Date(x.getFullYear(),x.getMonth(),x.getDate()))/864e5); return dz===0?'Azi':dz===1?'Ieri':x.toLocaleDateString('ro-RO',{day:'numeric',month:'long'}); };

function itemi(){
  const dec = S.dec.filter(d=>!d.rezolvata).map(d=>({tip:'decizie',id:d.id,proiect:d.proiect||'ecosistem',titlu:d.titlu,det:d.text,chip:'Decizie',o:0}));
  const ide = S.idei.map(i=>({tip:'idee',id:i.id,proiect:i.proiect||'ecosistem',titlu:i.titlu,det:[i.potential&&'Potențial: '+i.potential,i.verdict&&'Verdict: '+i.verdict,i.sursa&&'Sursa: '+i.sursa,i.detalii].filter(Boolean).join('\n\n'),chip:'Idee',o:1}));
  const pct = PCT().filter(p=>p.stare!=='done').map(p=>({tip:'punct',id:p.id,proiect:p.proiect||'ecosistem',titlu:p.titlu,det:p.detalii||p.titlu,chip:p.stare==='blocked'?'Punct blocat':'Punct',o:p.stare==='blocked'?4:p.brief==='9-Agenti'?2:3}));
  return [...dec,...ide,...pct].sort((a,b)=>a.o-b.o);
}
const vizibile = () => itemi().filter(x=>!ascuns(x));

/* ——— componente de conținut ——— */

/* ——— ACASĂ ——— */
function cautaGlobal(t){
  t = t.toLowerCase(); const r = [];
  S.prj.forEach(p=>{ if ((p.nume+' '+(p.descriere||'')).toLowerCase().includes(t)) r.push({k:'proiect',p:p.id,titlu:p.nume,sub:p.descriere}); });
  itemi().forEach(x=>{ if ((x.titlu+' '+(x.det||'')).toLowerCase().includes(t)) r.push({k:x.tip,p:x.proiect,id:x.tip+'|'+x.id,titlu:x.titlu,sub:sumar(x.det)}); });
  return r.slice(0,20);
}
function rAcasa(){
  const ap = S.ap.filter(a=>a.decizie==='asteapta'), dec = vizibile().filter(x=>x.tip==='decizie');
  const lucru = S.cer.filter(c=>['preluata','in_lucru'].includes(c.stare)), noi = cnt(S.cer,c=>c.stare==='noua');
  const need = ap.length + dec.length;
  const gata = S.cer.filter(c=>['gata','esuata'].includes(c.stare)&&c.interpretare?.tip!=='bilant'&&new Date(c.actualizat_la)>prevSeen).slice(0,6);
  const ultimele = gata.length ? gata : S.cer.filter(c=>c.stare==='gata'&&c.interpretare?.tip!=='bilant').slice(0,4);
  const grup = {}; dec.forEach(x=>(grup[x.proiect] ||= []).push(x));
  ap.forEach(a=>(grup[apP(a)] ||= []));
  const ordine = S.prj.map(p=>p.id).filter(id=>grup[id]);
  const rez = qg.length>1 ? cautaGlobal(qg) : null;
  setHTML('s-acasa',
  `<input id="qg" type="text" placeholder="Caută în tot ecosistemul: proiecte, decizii, idei, puncte" aria-label="Caută" value="${esc(qg)}">
  ${rez ? `<div class="sec-t"><h2>Rezultate</h2><span class="c">${rez.length}</span></div><div class="stack">${rez.map(r=>`<button class="pj" data-open="${esc(r.p)}" data-item="${esc(r.id||'')}"><span class="t">${esc(r.titlu)}</span><span class="tag">${r.k==='proiect'?'proiect':esc(pjn(r.p))}</span><span class="meta w">${esc(r.sub||'')}</span></button>`).join('')||'<div class="empty">Nimic găsit.</div>'}</div>` : `
  <div class="hero" style="margin-top:16px"><div class="num big ${need?'attn':''}">${need}</div><div class="tx"><div class="t" style="font-weight:600;font-size:16px">${need?'lucruri te așteaptă':'Nimic nu te așteaptă'}</div><div class="meta">${ap.length} aprobări · ${dec.length} decizii deschise, în ${ordine.length} proiecte</div></div></div>
  <div class="sec-t"><h2>Proiectele tale</h2><span class="c">${S.prj.length}</span></div>
  <div class="grid g2">${S.prj.map(p=>{ const d=cnt(vizibile(),x=>x.tip==='decizie'&&x.proiect===p.id), pu=cnt(vizibile(),x=>x.tip==='punct'&&x.proiect===p.id), l=cnt(S.cer,c=>['noua','preluata','in_lucru'].includes(c.stare)&&cerP(c)===p.id), a1=(p.activitate||'').split('\n')[0];
     return `<button class="pj" data-open="${p.id}"><span class="t">${esc(p.nume)}</span><span class="st ${p.stare&&/activ/.test(p.stare)?'ok':''}">${esc(p.stare||'fără stare')}</span>
       <span class="meta w">${d?`${d} decizii · `:''}${pu?`${pu} puncte · `:''}${l?`${l} în lucru · `:''}${a1?`ultima activitate ${esc(a1.slice(0,10))}`:'fără activitate în git'}</span></button>`}).join('')}</div>
  ${ordine.length?`<div class="sec-t"><h2>Te așteaptă, pe proiecte</h2><span class="c">${need}</span></div>` + ordine.map(id=>{ const ds=grup[id], aps=ap.filter(a=>apP(a)===id);
     return `<div style="margin-bottom:16px"><div class="sec-t" style="margin-top:8px"><h2 style="font-size:14px;color:var(--muted)">${esc(pjn(id))}</h2><button class="btn txt sm l" data-open="${id}" data-tab="decis">Toate (${ds.length}) ›</button></div><div class="grid g2">${aps.map(a=>cardAp(a,false)).join('')}${ds.slice(0,2).map(x=>cardItem(x,false)).join('')}</div></div>`}).join('') : `<div class="sec-t"><h2>Te așteaptă</h2></div><div class="empty">Nimic de decis sau de aprobat.</div>`}

  ${ultimele.length?`<div class="stack">${ultimele.map(c=>cardGata(c,true)).join('')}</div>`:'<div class="empty">Încă nimic terminat.</div>'}`}`);
}

/* ——— STADIU (per proiect): starea, ce așteaptă, firul cronologic ——— */
function eveniment(p){
  const ev = [];
  (p.activitate||'').split('\n').filter(Boolean).forEach(l=>{ const m=l.match(/^(\d{4}-\d{2}-\d{2}) · (.*)$/); if (m) ev.push({t:new Date(m[1]+'T12:00:00'),k:'git',text:m[2]}); });
  S.cer.filter(c=>cerP(c)===p.id).forEach(c=>{
    ev.push({t:new Date(c.creat_la),k:'ad',text:(c.interpretare?.tip==='bilant'?'Ai cerut bilanțul proiectului':c.interpretare?.mod==='autonom'?'Ai pornit singur: ':'Ai cerut: ')+(c.interpretare?.tip==='bilant'?'':titluC(c))});
    if (c.stare==='gata') ev.push({t:new Date(c.actualizat_la),k:'jv',text:'Jarvis a terminat: '+titluC(c)});
    if (c.stare==='esuata') ev.push({t:new Date(c.actualizat_la),k:'jv',text:'Jarvis nu a reușit: '+titluC(c)});
  });
  S.act.forEach(a=>{ const x=itemi().find(i=>i.tip===a.item_tip&&i.id===a.item_id); if (x&&x.proiect===p.id) ev.push({t:new Date(a.creat_la),k:'ad',text:{fa:'Ai dat de lucru pe',autonom:'Ai dat de lucru singur pe',amana:'Ai amânat',respinge:'Ai respins',aprob:'Ai aprobat',nota:'Ai lăsat o notă la'}[a.actiune]+': '+x.titlu}); });
  return ev.sort((a,b)=>b.t-a.t).slice(0,40);
}

  const bil = S.cer.find(c=>c.interpretare?.tip==='bilant'&&cerP(c)===p.id&&c.stare==='gata');

  `<div class="card"><div class="ctxhead"><div class="grow"><h2 style="font-size:19px">${esc(p.nume)}</h2><div class="meta" style="margin-top:4px"><span class="st ${p.stare&&/activ/.test(p.stare)?'ok':''}">${esc(p.stare||'stare necunoscută')}</span></div><p style="margin:8px 0 0">${esc(p.descriere||'')}</p></div>
     <div class="acts" style="margin:0"><button class="btn sec" data-bilant-open="${p.id}">${bilCurs?'Bilanț în lucru…':bil?'Bilanț':'Bilanț'}</button><button class="btn" data-go="chat">${ic('chat')}Chat</button></div></div></div>
   <div class="sec-t"><h2>Te așteaptă pe acest proiect</h2><span class="c">${dec.filter(x=>x.tip==='decizie').length+ap.length}</span><button class="btn txt sm l" data-go="decis">Toate (${dec.length}) ›</button></div>
   <div class="grid g2">${ap.map(a=>cardAp(a,false)).join('')}${dec.filter(x=>x.tip==='decizie').slice(0,2).map(x=>cardItem(x,false)).join('') || (ap.length?'':'<div class="empty">Nicio decizie deschisă pe acest proiect.</div>')}</div>
   <div class="sec-t"><h2>Lucrează acum</h2><span class="c">${lucru.length}</span></div>

   <div class="sec-t"><h2>Firul proiectului</h2><span class="c">${ev.length}</span></div>
   ${ev.length?`<ul class="tl">${ev.map(e=>{ const z=zi(e.t); const h = z!==zc ? `<li class="dl"><div class="d">${esc(z)}</div></li>` : ''; zc=z; return h+`<li class="${e.k}"><div>${esc(e.text)}</div><div class="meta">${e.k==='git'?'modificare în proiect':e.k==='ad'?'tu':'Jarvis'}</div></li>`; }).join('')}</ul>`:'<div class="empty">Încă nu există activitate înregistrată pentru acest proiect.</div>'}`);
}

/* ——— DE DECIS ——— */
function rDecis(){
  const all = itemi().filter(x=>inC(x.proiect)), vis = all.filter(x=>!ascuns(x)), asc = all.filter(ascuns);
  const l = fDec==='ascunse' ? asc : vis.filter(x=>fDec==='deschise'||{decizii:'decizie',idei:'idee',puncte:'punct'}[fDec]===x.tip);
  const F = [['deschise','Toate',vis.length],['decizii','Decizii',cnt(vis,x=>x.tip==='decizie')],['idei','Idei',cnt(vis,x=>x.tip==='idee')],['puncte','Puncte',cnt(vis,x=>x.tip==='punct')],['ascunse','Puse deoparte',asc.length]];
  const cuP = ctx==='acasa', vv = l.slice(0,pagina);

  micStop(); draft = ''; $('t').value = '';
  const c = await cere(text,{sursa:'telefon'}); if (!c) return;
  await db.from('mesaje').insert({autor:'adrian',text,cerere_id:c.id});
  toast(runnerOn()?'Trimis. Jarvis lucrează; răspunsul apare mai jos.':'Trimis. Așteaptă pornirea runner-ului.'); load();
});
document.querySelector('main').addEventListener('click', async e => {
  const T = e.target;
  const op = T.closest('[data-open]'); if (op) { const id = op.dataset.open; if (id!=='acasa') ls('jv_projused','1'); const it = op.dataset.item; if (it) { OPEN.add('d-'+it); LAST['s-decis']=''; fDec='deschise'; qg=''; go(id,'decis'); } else go(id, op.dataset.tab || 'stadiu'); return; }
  const g = T.closest('[data-go]'); if (g) { const [n,arg] = g.dataset.go.split(':'); if (arg) fTip = arg; return go(ctx,n); }
  const bo = T.closest('[data-bilant-open]'); if (bo) return bilantDialog(bo.dataset.bilantOpen);
  const bi = T.closest('[data-bilant]'); if (bi) return bilant(bi.dataset.bilant);
  const tp = T.closest('[data-tip]'); if (tp) { fTip = tp.dataset.tip; q=''; LAST['s-avem']=''; return rAvem(); }
  const ff = T.closest('[data-ff]'); if (ff) { fDec = ff.dataset.ff; pagina = 30; return rDecis(); }
  if (T.closest('[data-mai]')) { pagina += 30; return rDecis(); }
  if (T.closest('#mic')) return micToggle();
  if (T.closest('[data-clear]')) { micStop(); draft = ''; $('t').value = ''; return; }
  const fr = T.closest('[data-fraza]'); if (fr) { draft = FRAZE[fr.dataset.fraza]; $('t').value = draft; $('t').focus(); return; }
  const use = T.closest('[data-use]'); if (use) { ls('jv_use','1'); draft = `Folosește ${use.dataset.tp==='agent'?'agentul':'skill-ul'} ${use.dataset.use} pentru: `; go(ctx,'chat'); $('t').value = draft; $('t').focus(); return; }
  const run = T.closest('[data-run]'); if (run) return ruleaza(run.dataset.run);
  const et = T.closest('[data-etapa]'); if (et) { const e9 = ETP().find(x=>x.id==='E-'+et.dataset.etapa); await cere(`Etapa ${et.dataset.etapa} din Drumul ecosistemului („${e9.titlu}”): ${e9.detalii}. Propune primul pas concret, cu cost și durată, și pregătește-l. Nu executa nimic ireversibil.`,{interp:{item_tip:'etapa',item_id:e9.id,proiect:'ecosistem'}}); toast('Trimis. Răspunsul apare în Chat.'); return load(); }
  if (T.id==='sAdd') { const t=$('sT').value.trim(), p=$('sP').value.trim(); if (!t||!p) return;
    const {data,error} = await db.from('sarcini_autonome').insert({titlu:t,descriere:p.slice(0,160),prompt:p,proiect:ctx==='acasa'?'ecosistem':ctx}).select().single(); if (error) return alert(error.message); $('sT').value=''; $('sP').value=''; return ruleaza(data.id,data); }
  const b = T.closest('button'); if (!b) return;
  if (b.dataset.id) { await db.from('aprobari').update({decizie:b.dataset.d,decis_la:new Date().toISOString()}).eq('id',b.dataset.id); return load(); }
  const a = b.dataset.a; if (a) {
    const k = b.closest('[data-k]')?.dataset.k || b.dataset.k;
    if (a==='nota') { notaK = k; LAST['s-decis']=''; LAST['s-acasa']=''; LAST['s-stadiu']=''; return renderAll(); }
    if (a==='trimite-nota') { const v = $('nota').value.trim(); if (!v) return; return actiune(k,a,v); }
    return actiune(k,a); }
});
