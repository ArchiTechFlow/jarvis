<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<title>Jarvis TechFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
/* TEMA v2 — simplu. O culoare de accent, un singur tip de rând, zero text explicativ. Vezi TEMA-JARVIS.md. */
:root{
  --bg:#f6f5f1;--ink:#1b2433;--muted:#5f6675;--line:#dcd8cd;--ctl:#8a8474;--accent:#1f3a5f;--on-accent:#fff;--bad:#b3261e;
  --f-head:'Archivo',system-ui,sans-serif;--f-body:'Barlow',system-ui,sans-serif;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--r:10px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#12161d;--ink:#e9ecf2;--muted:#9aa4b5;--line:#2b3444;--ctl:#66738a;--accent:#8fb4f0;--on-accent:#0f1620;--bad:#f28b82}}
:root[data-theme=dark]{
  --bg:#12161d;--ink:#e9ecf2;--muted:#9aa4b5;--line:#2b3444;--ctl:#66738a;--accent:#8fb4f0;--on-accent:#0f1620;--bad:#f28b82}
html{color-scheme:light dark}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
h1{font:700 22px/1.2 var(--f-head);margin:0 0 var(--s2);letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.f{fill:currentColor;stroke:none}

/* cadru: o singură coloană, la fel pe telefon și pe desktop */
#app{display:none}#app.on{display:block}
#top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top)}
#top .in{max-width:720px;margin:0 auto;height:56px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:0 var(--s2)}
#top .ti{font:700 17px var(--f-head);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;border-radius:50%;cursor:pointer;color:var(--ink)}
.ib:hover{background:var(--line)}
#view{max-width:720px;margin:0 auto;padding:var(--s2) var(--s4) 132px}

/* singurul tip de listă: rând */
.lbl{font-size:14px;font-weight:600;color:var(--muted);margin:var(--s5) 0 var(--s1)}
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);align-items:center;width:100%;min-height:56px;padding:var(--s3) 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:var(--ink);font:inherit}
button.row{cursor:pointer}
button.row:hover{background:color-mix(in srgb,var(--line) 40%,transparent)}
.row b{display:block;font-weight:600}
.row small{display:block;color:var(--muted);font-size:14px;line-height:1.35;margin-top:2px}
.row .side{color:var(--muted);font-size:14px;white-space:nowrap}
.row.go .side::after{content:" ›";font-size:18px}
.row.bad b{color:var(--bad)}

/* butoane: unul principal, restul contur; text simplu */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:48px;min-width:44px;padding:0 var(--s4);border-radius:var(--r);border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer;text-align:center}
.btn.sec{background:transparent;color:var(--accent)}
.btn.txt{background:none;border-color:transparent;color:var(--muted);font-weight:400}
.btn.del{color:var(--bad);border-color:var(--bad);background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin:var(--s4) 0}
input[type=text],input[type=email],input[type=password],textarea{width:100%;min-height:48px;padding:10px var(--s3);border-radius:var(--r);border:1px solid var(--ctl);background:transparent}
.fisa h3{font-size:14px;font-weight:600;color:var(--muted);margin:var(--s4) 0 var(--s1)}
.fisa p,.txt{margin:0;white-space:pre-wrap;word-wrap:break-word}
.meta{color:var(--muted);font-size:14px}
pre{white-space:pre-wrap;word-wrap:break-word;font:400 15px/1.5 var(--f-body);margin:var(--s2) 0 0}
details>summary{cursor:pointer;color:var(--muted);font-size:14px;padding:var(--s3) 0;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:" ›";font-size:18px}
details[open]>summary::after{content:" ⌄"}

/* conversație */
.msg{max-width:88%;padding:var(--s3) var(--s4);border-radius:var(--r);white-space:pre-wrap;word-wrap:break-word;margin:var(--s2) 0}
.msg.eu{margin-left:auto;background:var(--accent);color:var(--on-accent)}
.msg.eu .meta{color:var(--on-accent);opacity:.8}
.msg.jv{max-width:100%;padding:var(--s2) 0}
.who{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:var(--s1)}
.ask{margin-top:var(--s3);padding:var(--s3);border-radius:var(--r);border:1px solid var(--accent);white-space:pre-wrap}
.msg hr{border:0;border-top:1px solid var(--line);margin:var(--s3) 0}

/* caseta unică, fixă jos: un singur buton (mic / trimite / oprește) */
#cmp{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:var(--s2) var(--s4);padding-bottom:calc(var(--s2) + env(safe-area-inset-bottom));display:none}
#cmp.on{display:block}
#cmp form{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 48px;gap:var(--s2);align-items:end}
#cmp textarea{min-height:48px;max-height:140px;resize:none;overflow-y:auto}
#cmpb{width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer}
.toast{position:fixed;left:var(--s4);right:var(--s4);bottom:96px;z-index:9;max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);padding:var(--s3) var(--s4);border-radius:var(--r);display:none}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:85dvh}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dh{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s2) var(--s2) var(--s2) var(--s4);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
dialog .dh b{font:700 17px var(--f-head)}
dialog .db{padding:var(--s2) var(--s4) var(--s4)}
#login{margin:12vh auto 0;width:min(340px,90vw);display:grid;gap:var(--s3)}
</style>
</head>
<body>
<div id="login">
  <h1>Jarvis</h1>
  <input id="em" type="email" placeholder="Email" autocomplete="username" value="adrian@techflowtm.ro" aria-label="Email">
  <input id="pw" type="password" placeholder="Parolă" autocomplete="current-password" aria-label="Parolă">
  <button class="btn" id="go">Intră</button>
  <small id="err" style="color:var(--bad)"></small>
</div>

<div id="app">
  <div id="top"><div class="in"><button class="ib" id="bk" aria-label="Înapoi"></button><div class="ti" id="ti"></div><button class="ib" id="rt" aria-label="Meniu"></button></div></div>
  <div id="view"></div>
  <div id="cmp"><form id="f"><textarea id="t" rows="1" aria-label="Mesajul tău" placeholder="Scrie sau dictează"></textarea><button type="button" id="cmpb" aria-label="Dictează / trimite"></button></form></div>
</div>
<dialog id="dlg"><div class="dh"><b id="dt"></b><button class="ib" id="dx" aria-label="Închide"></button></div><div class="db" id="dbody"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = supabase.createClient('https://bvobmlkeselbugvhfepu.supabase.co','sb_publishable_UbxkA9hsv9c-zHyBZEfNEg_cCcxgLFR',
  {auth:{persistSession:true,autoRefreshToken:true}});
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ora = d => new Date(d).toLocaleString('ro-RO',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const cand = d => { const x=new Date(d), t=new Date(); return x.toDateString()===t.toDateString() ? x.toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'}) : x.toLocaleDateString('ro-RO',{day:'numeric',month:'short'}); };
const ls = (k,v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k,v); } catch {} };
const cnt = (a,f) => a.filter(f).length;
const taie = (t, n) => { t = String(t||'').replace(/[*`#>]/g,'').replace(/\s+/g,' ').trim(); if (t.length <= n) return t; const c = t.slice(0, n); return c.slice(0, c.lastIndexOf(' ') > 30 ? c.lastIndexOf(' ') : n) + '…'; };
const curat = t => String(t||'').replace(/^\d+\s*·\s*/,'');

/* ——— temă ——— */
const TEME = ['auto','light','dark'], TEMA_NUME = {auto:'Automată',light:'Luminoasă',dark:'Întunecată'};
function aplicaTema(){ const t = TEME.includes(ls('jv_tema')) ? ls('jv_tema') : 'auto'; if (t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }
aplicaTema();

/* ——— iconițe ——— */
const P = {back:'<path d="M15 5l-7 7 7 7"/>',dots:'<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',send:'<path d="M5 12h14M13 6l6 6-6 6"/>',stop:'<rect x="7" y="7" width="10" height="10" rx="1.5"/>'};
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

/* ——— date ——— */
const S = {inv:[],pct:[],dec:[],idei:[],cer:[],ap:[],msg:[],act:[],sar:[],uti:[],run:[],prj:[],jur:[],cc:[],cm:[],fis:[]};
let ctx='acasa', thread=null, rec=null, draft='', notaK=null, meniu=null, arataArh=false, arataIna=false, qg='', fTip='';
let ultimTrimis = {t:'',ts:0};
const prevSeen = Number(ls('jv_seen')) || Date.now() - 864e5;
const OPEN = new Set(), LAST = {};
document.addEventListener('toggle', e => { const d = e.target; if (d.tagName==='DETAILS' && d.dataset.oid) d.open ? OPEN.add(d.dataset.oid) : OPEN.delete(d.dataset.oid); }, true);
function setHTML(id, html){ const el = $(id); if (LAST[id] === html) return; LAST[id] = html; el.innerHTML = html; el.querySelectorAll('details[data-oid]').forEach(d => { if (OPEN.has(d.dataset.oid)) d.open = true; }); }
const toast = m => { const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display='none',3500); };
const pj = id => S.prj.find(p=>p.id===id);
const pjn = id => pj(id)?.nume || (id||'Ecosistem');
const runnerOn = () => { const r=S.run.find(x=>x.masina==='windows'); return r && (Date.now()-new Date(r.ultima))<60000 ? r : null; };
const ultima = (tip,id) => S.act.find(a=>a.item_tip===tip&&a.item_id===id);
const ascuns = x => ['amana','respinge','aprob'].includes(ultima(x.tip,x.id)?.actiune);
const util = (tip,nume) => S.uti.find(u=>u.tip===tip&&u.nume===nume.replace(/ \(.*\)/,''));
const raspuns = c => { const ms = S.msg.filter(x=>x.cerere_id===c.id&&x.autor==='jarvis').map(x=>x.text);
  const m = (c.interpretare?.tip==='bilant'||c.interpretare?.sarcina_id) ? ms.sort((a,b)=>b.length-a.length)[0] : ms.join('\n\n'); return m || c.rezultat || ''; };
const cerP = c => c.interpretare?.proiect || 'ecosistem';
const titluCurat = c => { const i=c.interpretare||{}; return i.interpret?.titlu || i.titlu || i.interpret?.teme?.[0]?.tema || titluC(c); };
const titluC = c => { if (c.interpretare?.tip==='bilant') return 'Bilanț '+pjn(cerP(c)); if (c.interpretare?.mesaj) return c.interpretare.mesaj.slice(0,200); const s=c.interpretare?.sarcina_id&&S.sar.find(x=>x.id===c.interpretare.sarcina_id); return s ? s.titlu : c.sursa==='buton' ? c.text_brut.split('\n')[0].slice(0,120) : c.text_brut.slice(0,200); };
const apP = a => cerP(S.cer.find(c=>c.id===a.cerere_id) || {});
const PCT = () => S.pct.filter(p=>!p.id.startsWith('E-'));
const ETP = () => S.pct.filter(p=>p.id.startsWith('E-')).sort((a,b)=>a.id.localeCompare(b.id));
const inC = id => ctx==='acasa' || (id||'ecosistem')===ctx;

/* ——— grupele proiectelor ——— */
const GRUP = [['produse','Produse și aplicații',['gata','main','motor']],['ecosistem','Ecosistem',['ecosistem','handbook','jarvis','ofertare']],['clienti','Clienți și colaborări',['prisma','personal']]];
const zileDe = p => { const t = Date.parse(((p.activitate||'').split('\n')[0]||'').slice(0,10)); return isNaN(t) ? null : Math.floor((Date.now()-t)/864e5); };
const inactiv = p => !p.stare || (zileDe(p)!==null && zileDe(p)>30 && !/activ|dezvolt|construc/.test(p.stare));
const grupDe = p => { if (inactiv(p)) return 'inactive'; const g = GRUP.find(x=>x[2].includes(p.id)); return g ? g[0] : p.tip==='produs' ? 'produse' : p.tip==='ecosistem' ? 'ecosistem' : 'clienti'; };
const ordineProiecte = () => { const gi = p => { const i = ['produse','ecosistem','clienti','inactive'].indexOf(grupDe(p)); return i<0?9:i; }; return [...S.prj].sort((a,b)=>gi(a)-gi(b)||(a.prioritate??99)-(b.prioritate??99)).map(p=>p.id); };

/* ——— decizii, idei, puncte ——— */
const fisaDe = id => S.fis.find(z=>z.id===id);
function itemi(){
  const blocheaza = id => { const b = fisaDe(id)?.blocheaza; return !!b && !/^fără termen/i.test(b); };
  const dec = S.dec.filter(d=>!d.rezolvata).map(d=>({tip:'decizie',id:d.id,proiect:d.proiect||'ecosistem',titlu:d.titlu,det:d.text,chip:'Decizie',o:blocheaza(d.id)?-1:0}));
  const ide = S.idei.map(i=>({tip:'idee',id:i.id,proiect:i.proiect||'ecosistem',titlu:i.titlu,det:[i.potential&&'Potențial: '+i.potential,i.verdict&&'Verdict: '+i.verdict,i.sursa&&'Sursa: '+i.sursa,i.detalii].filter(Boolean).join('\n\n'),chip:'Idee',o:1}));
  const pct = PCT().filter(p=>p.stare!=='done').map(p=>({tip:'punct',id:p.id,proiect:p.proiect||'ecosistem',titlu:p.titlu,det:(p.rang?`De ce acum: ${p.de_ce||'-'}\nDepinde de: ${p.depinde||'nimic'}\n\n`:'')+(p.detalii||p.titlu),chip:p.stare==='blocked'?'Punct blocat':'Punct',rang:p.rang,o:p.rang?2+p.rang/100:p.stare==='blocked'?9:5}));
  return [...dec,...ide,...pct].sort((a,b)=>a.o-b.o);
}
const vizibile = () => itemi().filter(x=>!ascuns(x));
const kind = x => x.tip==='decizie' ? 'hotarat' : x.chip==='Punct blocat' ? 'blocat' : x.tip==='idee' ? 'idee' : 'facut';
const tkey = t => t ? t.tip+'|'+t.id : null;

/* ——— rândul: singura formă de listă ——— */
const rand = (titlu, sub, side, href, extra='') => { const tag = href||extra ? 'button' : 'div'; return `<${tag} class="row ${href||extra?'go':''}" ${href?`data-href="${esc(href)}"`:''} ${extra}><span><b>${esc(titlu)}</b>${sub?`<small>${esc(sub)}</small>`:''}</span><span class="side">${esc(side||'')}</span></${tag}>`; };
const lista = rows => rows.length ? `<div class="list">${rows.join('')}</div>` : '';
const lbl = t => `<div class="lbl">${esc(t)}</div>`;
const rowItem = x => rand(curat(x.titlu), pjn(x.proiect), '', '#/d/'+encodeURIComponent(x.tip+'|'+x.id));
const rowAp = a => rand(a.ce, pjn(apP(a)), '', '#/a/'+a.id);
const rowCer = (c, sub) => rand(taie(titluCurat(c),80), sub, '', '#/chat/'+encodeURIComponent(cheieConv(c)));

/* ——— ecrane ——— */
function vAcasa(){
  const ap = S.ap.filter(a=>a.decizie==='asteapta'), dec = vizibile().filter(x=>kind(x)==='hotarat');
  const ask = S.cer.filter(c=>c.stare==='asteapta_adrian' && !meta(cheieConv(c)).arhivat);
  const wAll = [...ask.map(c=>rowCer(c,'Te întreabă · '+pjn(cerP(c)))), ...ap.map(rowAp), ...dec.map(rowItem)], wait = wAll.slice(0,3);
  const lucru = S.cer.filter(c=>['noua','preluata','in_lucru'].includes(c.stare)), gata = S.cer.filter(c=>c.stare==='gata'&&c.interpretare?.tip!=='bilant').slice(0,3);
  const acum = [...lucru.map(c=>rowCer(c,'Lucrează')), ...gata.map(c=>rowCer(c,'Terminat · '+cand(c.actualizat_la)))];
  const grup = id => S.prj.filter(p=>grupDe(p)===id).sort((a,b)=>ordineProiecte().indexOf(a.id)-ordineProiecte().indexOf(b.id));
  const rowP = p => { return rand(p.nume, '', '', '#/p/'+p.id); };
  const ina = grup('inactive');
  return (!runnerOn() && (lucru.length||S.cer.some(c=>c.stare==='noua')) ? `<div class="meta" style="margin:var(--s2) 0">Calculatorul e oprit; cererile așteaptă.</div>` : '')
    + (wait.length ? `<div class="lbl">Te așteaptă · <span style="color:var(--accent)">${wAll.length}</span></div>`+lista(wait)+(wAll.length>3?lista([rand('Toate ('+wAll.length+')','','','#/toate')]):'') : '')
    + (acum.length ? lbl('Acum')+lista(acum) : '')
    + GRUP.map(([id,nume])=>grup(id).length ? lbl(nume)+lista(grup(id).map(rowP)) : '').join('')
    + (ina.length ? lbl('Inactive')+lista(arataIna ? ina.map(rowP) : [rand('Inactive ('+ina.length+')','','','', 'data-ina="1"')]) : '');
}
function vProiect(id){
  const p = pj(id); if (!p) return '';
  const ap = S.ap.filter(a=>a.decizie==='asteapta'&&apP(a)===id), it = vizibile().filter(x=>x.proiect===id&&kind(x)==='hotarat');
  const sar = S.sar.filter(s=>(s.proiect||'ecosistem')===id);
  const of = (p.oferte||'').split('\n').filter(Boolean), fis = (p.fisiere||'').split('\n').filter(Boolean);
  const bilCurs = S.cer.find(c=>c.interpretare?.tip==='bilant'&&cerP(c)===id&&['noua','preluata','in_lucru'].includes(c.stare));
  const ev = eveniment(p);
  return `<h1>${esc(p.nume)}</h1><div class="meta">${esc(p.stare||'')}</div>`
    + (p.urmatorul_pas ? lbl('Următorul pas')+`<p class="txt">${esc(p.urmatorul_pas)}</p>${p.actor?`<div class="meta" style="margin-top:var(--s1)">${esc(p.actor)}</div>`:''}` : '')
    + lista([rand('Discutăm despre proiect','','','', `data-recdez="${p.id}"`), rand('Bilanț', bilCurs?'în lucru':'','','', `data-bilant-open="${p.id}"`)])
    + ((ap.length||it.length) ? lbl('Te așteaptă')+lista([...ap.map(rowAp),...it.map(rowItem)]) : '')
    + (p.tip==='client' && of.length ? lbl('Oferte')+lista(of.map(o=>rand(o,'','', '', `data-ofdez="${esc(o.split(' · ')[0])}"`))) : '')
    + (p.tip==='client' && fis.length ? lista([rand('Documente ('+fis.length+')','Rezumă-mi documentele','','', 'data-docdez="1"')]) : '')
    + (sar.length ? lbl('Sarcini')+lista(sar.map(s=>{ const c=S.cer.find(c=>c.interpretare?.sarcina_id===s.id); return rand(s.titlu, s.ultima_rulare?'ultima rulare '+cand(s.ultima_rulare):'nerulată', 'Rulează','', `data-run="${s.id}"`); })) : '')
    + lista([rand('Conversații','','','#/chat', `data-ctx="${p.id}"`), rand('Toate deciziile, ideile și punctele','','','#/toate', `data-ctx="${p.id}"`)])
    + (ev.length ? `<details data-oid="ist-${p.id}" style="margin-top:var(--s3)"><summary>Istoric</summary>${lista(ev.slice(0,15).map(e=>rand(e.text, cand(e.t)+' · '+(e.k==='git'?'modificare':e.k==='ad'?'tu':'Jarvis'))))}</details>` : '');
}
function eveniment(p){
  const ev = [];

async function cere(text, extra){
  const interp = {...(extra?.interp||{})}; if (!interp.proiect && ctx!=='acasa') interp.proiect = ctx;
  const {data,error} = await db.from('cereri').insert({sursa:extra?.sursa||'buton',text_brut:text,interpretare:Object.keys(interp).length?interp:null}).select().single();
  if (error) { alert(error.message); return null; }
  return data;
}
function deschideConv(c, titlu){ if (!c) return; thread = {tip:'conv',id:c.id,titlu:(titlu||titluC(c)).slice(0,120),proiect:cerP(c)}; location.hash = '#/chat/'+encodeURIComponent(tkey(thread)); }
function openThread(t){ thread = t; location.hash = '#/chat/'+encodeURIComponent(tkey(t)); }
async function actiune(k,a,nota){
  const [tip,id] = k.split('|'), x = itemi().find(i=>i.tip===tip&&i.id===id) || {titlu:id,det:'',proiect:'ecosistem'};
  if (a==='dezbatem') return openThread({tip,id,titlu:curat(x.titlu),proiect:x.proiect,det:x.det});
  const {error} = await db.from('actiuni').insert({item_tip:tip,item_id:id,actiune:a==='trimite-nota'?'nota':a,nota:nota||null});
  if (error) return alert(error.message);
  const ctxt = `[${id}] ${x.titlu}\n\n${(x.det||'').slice(0,1500)}`; let text=null;
  if (a==='fa') text = `Execută, în măsura în care e reversibil: ${ctxt}\n\nDacă îți lipsește o informație, întreabă în răspuns.`;
  if (a==='aprob') text = `Adrian APROBĂ decizia ${ctxt}\n\nÎnregistreaz-o în 01 TechFlow-OS/_HARNESS/DECIZII-PENTRU-ADRIAN.md cu REZOLVAT ${new Date().toISOString().slice(0,10)} și aplică ce ține de tine.`;
  if (a==='trimite-nota' && nota) text = `Notă de la Adrian pe ${ctxt}\n\nNota: ${nota}\n\nÎnregistreaz-o (pentru decizii, în DECIZII-PENTRU-ADRIAN.md) și acționează pe ea.`;
  notaK = null;
  if (text) { const c = await cere(text,{interp:{item_tip:tip,item_id:id,proiect:x.proiect}}); toast(runnerOn()?'Trimis. Jarvis lucrează.':'Trimis. Așteaptă pornirea calculatorului.'); await load(); deschideConv(c, curat(x.titlu)); }
  else { toast('Notat.'); await load(); if (a==='amana'||a==='respinge') location.hash = '#/'; else render(); }
}
async function ruleaza(id){ const s = S.sar.find(x=>String(x.id)===String(id)); if (!s) return;
  await db.from('actiuni').insert({item_tip:'sarcina',item_id:String(id),actiune:'fa'});
  await cere(s.prompt,{interp:{mod:'autonom',sarcina_id:s.id,proiect:s.proiect||'ecosistem'}}); toast(runnerOn()?'Pornit.':'Trimis. Așteaptă pornirea calculatorului.'); load(); }
async function bilant(id){ const p = pj(id); await cere('Bilanț proiect '+p.nume,{interp:{tip:'bilant',proiect:id,mod:'autonom'}}); toast(runnerOn()?'Pornit. Gata în câteva minute.':'Trimis. Așteaptă pornirea calculatorului.'); await load(); bilantDialog(id); }
function istoric(){
  if (S.cc.some(x=>x.cheie===tkey(thread))) return '';
  const h = firul().filter(c=>c.stare==='gata'||c.stare==='asteapta_adrian').slice(-3).map(c=>`Adrian: ${c.interpretare?.mesaj||c.text_brut.slice(0,400)}\nJarvis: ${raspuns(c).slice(0,700)}`).join('\n\n');
  return h ? `\n\nDiscuția de până acum:\n${h}` : '';
}
async function trimite(text, mod){
  if (text===ultimTrimis.t && Date.now()-ultimTrimis.ts<60000) return toast('Ai trimis deja exact asta.');
  ultimTrimis = {t:text,ts:Date.now()};
  const t = thread;
  if (t && ['conv','proiect'].includes(t.tip)) {
    const c = await cere(text,{sursa:'telefon',interp:{thread:tkey(t),proiect:t.proiect||(ctx!=='acasa'?ctx:null),mesaj:text}}); if (!c) return;
    await db.from('mesaje').insert({autor:'adrian',text,cerere_id:c.id});
    toast(runnerOn()?'Trimis.':'Trimis. Calculatorul e oprit.'); return load();
  }
  const brut = t ? `DISCUȚIE despre ${t.titlu}.\n\nContext:\n${(t.det||'').slice(0,1500)}${istoric()}\n\nAdrian: ${text}\n\n${mod==='apuca'?'Adrian a spus să te apuci: execută ce s-a stabilit în discuție, cât e reversibil.':'Răspunde ca partener de discuție: întreabă, opinează ferm, propune. Nu executa nimic și nu începe lucrul până nu spune „apucă-te”.'}`
    : (/^\s*c[âa]t sunt plecat/i.test(text) ? `MOD AUTONOM: ${text}` : text);
  const interp = t ? {thread:tkey(t),item_tip:t.tip,item_id:t.id,proiect:t.proiect,mesaj:text} : (/^\s*c[âa]t sunt plecat/i.test(text) ? {mod:'autonom',mesaj:text} : {mesaj:text});
  const c = await cere(brut,{sursa:'telefon',interp}); if (!c) return;
  await db.from('mesaje').insert({autor:'adrian',text,cerere_id:c.id});
  toast(runnerOn()?'Trimis.':'Trimis. Calculatorul e oprit.');
  if (!t) { thread = {tip:'conv',id:c.id,titlu:text.slice(0,70),proiect:cerP(c)}; location.hash = '#/chat/'+encodeURIComponent(tkey(thread)); }
  load();
}
/* ——— caseta jos: un singur buton (mic / trimite / oprește) ——— */
function cmpUI(){ const b=$('cmpb'), has = $('t').value.trim().length>0; b.dataset.mode = rec ? 'stop' : has ? 'send' : 'mic'; b.innerHTML = ic(rec ? 'stop' : has ? 'send' : 'mic'); b.setAttribute('aria-label', rec?'Oprește dictarea':has?'Trimite':'Dictează'); const t=$('t'); t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,140)+'px'; }
function micToggle(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast('Browserul nu are dictare. Folosește microfonul de pe tastatură.');
  if (rec) { try { rec.stop(); } catch {} return; }
  ls('jv_mic','1'); const r = new SR(); r.lang='ro-RO'; r.interimResults=true; r.continuous=true; rec = r;
  const base = $('t').value;
  r.onresult = e => { $('t').value = (base+' '+[...e.results].map(x=>x[0].transcript).join('')).trim(); draft = $('t').value; cmpUI(); };
  r.onend = () => { if (rec===r) rec=null; cmpUI(); };
  r.onerror = e => { if (rec===r) rec=null; cmpUI(); if (e.error==='not-allowed'||e.error==='service-not-allowed') toast('Permite microfonul pentru această pagină, apoi apasă din nou.'); else if (e.error==='no-speech') toast('Nu am auzit nimic.'); else if (e.error!=='aborted') toast('Microfon: '+e.error); };
  try { r.start(); } catch { rec=null; }
  cmpUI();
}
function micStop(){ if (rec) { const r=rec; rec=null; try { r.abort(); } catch {} cmpUI(); } }
async function trimiteCaseta(){ const text = $('t').value.trim(); if (!text) return; micStop(); draft=''; $('t').value=''; cmpUI(); await trimite(text); }

/* ——— rutare: adresa reține unde ești ——— */
const rt = () => { const h = location.hash.replace(/^#\/?/,''); const [a,...r] = h.split('/'); return {a: a||'acasa', rest: decodeURIComponent(r.join('/'))}; };
let navCount = 0;
function render(){
  const {a,rest} = rt();
  if (!(a==='chat' && rest)) thread = null;
  let ti='', html='', back=null, right='mai', cmp=false;
  if (a==='acasa') { ctx='acasa'; ti='Acasă'; html=vAcasa(); cmp=true; }
  else if (a==='p') { ctx=rest; ti=pjn(rest); html=vProiect(rest); back='#/'; cmp=true; }
  else if (a==='d') { ti='Decizie'; html=vItem(rest); back='#/'; right=null; }
  else if (a==='a') { ti='Aprobare'; html=vAprobare(rest); back='#/'; right=null; }
  else if (a==='toate') { ti='Decizii, idei, puncte'; html=vToate(); back=ctx!=='acasa'?'#/p/'+ctx:'#/mai'; }
  else if (a==='chat' && !rest) { ti='Conversații'; html=vChat(); back=ctx!=='acasa'?'#/p/'+ctx:'#/'; cmp=true; }
  else if (a==='chat') { const x = conversatii().find(z=>z.k===rest);
    if (!thread || tkey(thread)!==rest) { const [tip,...r]=rest.split('|'), id=r.join('|'); thread = x ? {tip,id,titlu:convTitlu(x),proiect:cerP(x.ult),det:''} : {tip,id,titlu:curat((itemi().find(z=>z.tip===tip&&z.id===id)||{}).titlu||'Conversație nouă'),proiect:ctx!=='acasa'?ctx:null,det:(itemi().find(z=>z.tip===tip&&z.id===id)||{}).det||''}; }
    ti='Conversație'; html=vThread(); back='#/chat'; right='menu'; cmp=true; }
  else if (a==='mai') { ctx='acasa'; ti='Mai mult'; html=vMai(); back='#/'; right=null; }
  else if (a==='avem') { ti='Ce avem'; html=vAvem(rest); back=rest?'#/avem':'#/mai'; right=null; }
  else if (a==='drum') { ti='Drumul'; html=vDrum(); back='#/mai'; right=null; }
  else if (a==='harta') { ti='Harta'; html=vHarta(); back='#/mai'; right=null; }
  else { ti='Acasă'; html=vAcasa(); cmp=true; }
  $('ti').textContent = ti;
  $('bk').innerHTML = back ? ic('back') : ''; $('bk').style.visibility = back ? 'visible' : 'hidden'; $('bk').dataset.to = back || '';
  $('rt').innerHTML = right==='mai' ? ic('dots') : right==='menu' ? ic('dots') : ''; $('rt').style.visibility = right ? 'visible' : 'hidden'; $('rt').dataset.k = right || '';
  const focus = document.activeElement?.id;
  setHTML('view', html);
  if (focus==='qg' && $('qg')) { const q=$('qg'); q.focus(); q.setSelectionRange(q.value.length,q.value.length); }
  $('cmp').classList.toggle('on', cmp);
  $('t').placeholder = a==='chat'&&rest ? 'Scrie' : 'Scrie sau dictează';
  cmpUI();
  if (a==='chat' && rest) { const k = tkey(thread)+'|'+(LAST.view||'').length; if (k!==render.k) { render.k = k; requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight})); } }
}
async function load(){
  if (document.activeElement?.id==='nota') return;
  const g = (t,o,n=500) => db.from(t).select('*').order(o[0],{ascending:o[1]}).limit(n).then(r=>r.data||[]);
  S.jur = await g('jurnal',['ts',false],30); S.cc = await g('conversatii_claude',['actualizat_la',false],100); S.cm = await g('conversatii',['cheie',true],300); S.fis = await g('decizii_fisa',['id',true],200);
  [S.inv,S.pct,S.dec,S.idei,S.cer,S.ap,S.msg,S.act,S.sar,S.uti,S.run,S.prj] = await Promise.all([
    g('inventar',['nume',true]),g('puncte',['id',true]),g('decizii',['id',true]),g('idei',['id',true]),g('cereri',['creat_la',false],120),g('aprobari',['creat_la',false],80),
    g('mesaje',['creat_la',true],300),g('actiuni',['creat_la',false]),g('sarcini_autonome',['titlu',true]),g('utilizare',['nr',false]),g('runner',['masina',true]),g('proiecte',['ordine',true])]);
  render();
  if ($('dlg').open && meniu==='bilant') { const t=$('dt').textContent.replace('Bilanț · ',''); const p=S.prj.find(x=>x.nume===t); if (p) bilantDialog(p.id); }
}
async function pulsNou(){ const r = await db.from('runner').select('*'); if (r.data) { S.run = r.data; render(); } }
let tmr; const usor = () => { clearTimeout(tmr); tmr = setTimeout(load,700); };
async function porneste(){
  $('login').style.display='none'; $('app').classList.add('on');
  await load();
  db.channel('jarvis').on('postgres_changes',{event:'*',schema:'public'},p => { if (p.table==='runner') return; usor(); }).subscribe();
  setInterval(pulsNou,20000);
  const seen = () => ls('jv_seen',String(Date.now())); addEventListener('pagehide',seen); document.addEventListener('visibilitychange',()=>{ if (document.hidden) seen(); });
}
addEventListener('hashchange', () => { navCount++; meniu=null; render(); window.scrollTo({top:0}); if (rt().a==='chat'&&rt().rest) requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight})); });
$('go').onclick = async () => { const {error} = await db.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value}); if (error) $('err').textContent = error.message; else porneste(); };
$('pw').onkeydown = e => { if (e.key==='Enter') $('go').click(); };
$('dx').innerHTML = ic('x'); $('dx').onclick = () => { meniu=null; $('dlg').close(); };
$('bk').onclick = () => { const to = $('bk').dataset.to; if (!to) return; if (navCount>0 && history.length>1) history.back(); else location.hash = to; };
$('rt').onclick = () => { const k = $('rt').dataset.k; if (k==='menu') { meniu='meniu'; rMeniu(); } else if (k==='mai') location.hash = '#/mai'; };
$('cmpb').onclick = () => { const m = $('cmpb').dataset.mode; if (m==='send') trimiteCaseta(); else if (m==='stop') micStop(); else micToggle(); };
$('t').addEventListener('input', e => { draft = e.target.value; cmpUI(); });
$('t').addEventListener('keydown', e => { if (e.key==='Enter' && (e.ctrlKey||e.metaKey)) { e.preventDefault(); trimiteCaseta(); } });
$('f').addEventListener('submit', e => { e.preventDefault(); trimiteCaseta(); });
$('view').addEventListener('input', e => { if (e.target.id==='qg') { qg = e.target.value.trim(); render(); } });
document.addEventListener('click', async e => {
  const T = e.target;
  const h = T.closest('[data-href]'); if (h) { const c = h.dataset.href; location.hash = c; return; }
  const cx = T.closest('[data-ctx]'); if (cx) { ctx = cx.dataset.ctx; return; }   // urmat de data-href pe același element: ordinea o rezolvă href
  if (T.closest('[data-ina]')) { arataIna = true; return render(); }
  if (T.closest('[data-tema]')) { const t = ls('jv_tema') || 'auto'; ls('jv_tema', TEME[(TEME.indexOf(t)+1)%3]); aplicaTema(); return render(); }
  if (T.closest('[data-out]')) { await db.auth.signOut(); location.reload(); return; }
  const ar = T.closest('[data-arh]'); if (ar) { arataArh = ar.dataset.arh==='1'; return render(); }
  const bo = T.closest('[data-bilant-open]'); if (bo) return bilantDialog(bo.dataset.bilantOpen);
  const bi = T.closest('[data-bilant]'); if (bi) return bilant(bi.dataset.bilant);
  const rd = T.closest('[data-recdez]'); if (rd) { const p = pj(rd.dataset.recdez); return openThread({tip:'proiect',id:p.id,titlu:p.nume,proiect:p.id,det:`Prioritatea ${p.prioritate}. ${p.motiv||''}\nUrmătorul pas propus: ${p.urmatorul_pas||'-'}\nCine: ${p.actor||''}`}); }
  const of = T.closest('[data-ofdez]'); if (of) { const c = await cere(`Rezumă-mi oferta ${of.dataset.ofdez} din 03 Clients/00 Ofertare/02 Oferte emise/ (valoare, componente, condiții, stare, ce urmează). Citește folderul ofertei; nu trimite nimic.`,{interp:{proiect:ctx}}); await load(); return deschideConv(c,'Oferta '+of.dataset.ofdez); }
  if (T.closest('[data-docdez]')) { const p = pj(ctx); const c = await cere(`Rezumă-mi documentele din folderul clientului «${p.nume}» (${p.surse}): ce conține fiecare, ce e recent, ce lipsește. Citește doar numele și conținutul fișierelor text; nu modifica nimic.`,{interp:{proiect:ctx}}); await load(); return deschideConv(c,'Documente '+p.nume); }
  const run = T.closest('[data-run]'); if (run) return ruleaza(run.dataset.run);
  const use = T.closest('[data-use]'); if (use) { ls('jv_use','1'); draft = `Folosește ${use.dataset.tp==='agent'?'agentul':'skill-ul'} ${use.dataset.use} pentru: `; $('t').value = draft; ctx='acasa'; thread=null; location.hash = '#/chat'; setTimeout(()=>{ $('t').focus(); cmpUI(); },50); return; }
  const et = T.closest('[data-etapa]'); if (et) { const e9 = ETP().find(x=>x.id==='E-'+et.dataset.etapa); const c = await cere(`Etapa ${et.dataset.etapa} din Drumul ecosistemului („${e9.titlu}”): ${e9.detalii}. Propune primul pas concret, cu cost și durată, și pregătește-l. Nu executa nimic ireversibil.`,{interp:{item_tip:'etapa',item_id:e9.id,proiect:'ecosistem'}}); await load(); return deschideConv(c,'Primul pas: '+e9.titlu); }
  const mm = T.closest('[data-m]'); if (mm) return actMeniu(mm.dataset.m);
  const mt = T.closest('[data-mut]'); if (mt) return actMeniu('mutare', mt.dataset.mut);
  const un = T.closest('[data-uneste]'); if (un) return actMeniu('unire', un.dataset.uneste);
  const ra = T.closest('[data-reask]'); if (ra) { const c = S.cer.find(z=>z.id===ra.dataset.reask); if (c) { ultimTrimis={t:'',ts:0}; await trimite(c.interpretare?.mesaj||c.text_brut.split('\n\nDiscuția de până acum')[0]); } return; }
  if (T.closest('[data-apuca]')) { micStop(); const v = $('t').value.trim() || 'Apucă-te.'; draft=''; $('t').value=''; cmpUI(); await trimite(v,'apuca'); return; }
  const b = T.closest('button'); if (!b) return;
  if (b.dataset.id) { await db.from('aprobari').update({decizie:b.dataset.d,decis_la:new Date().toISOString()}).eq('id',b.dataset.id); await load(); location.hash = '#/'; return; }
  const a = b.dataset.a; if (a) {
    const k = b.closest('[data-k]')?.dataset.k || b.dataset.k;
    if (a==='nota') { notaK = k; LAST.view=''; return render(); }
    if (a==='trimite-nota') { const v = $('nota').value.trim(); if (!v) return; return actiune(k,a,v); }
    return actiune(k,a); }
});
// rândurile cu data-ctx și data-href: data-ctx se aplică înainte de navigare
document.addEventListener('click', e => { const r = e.target.closest('[data-ctx][data-href]'); if (r) ctx = r.dataset.ctx; }, true);
db.auth.getSession().then(({data}) => { if (data.session) porneste(); });
