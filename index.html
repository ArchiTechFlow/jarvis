<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2433">
<title>Jarvis TechFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
/* SISTEM VIZUAL — reguli fixe.
   Culori: navy = acțiune (singurul buton plin) · portocaliu = „te așteaptă” · verde/roșu/galben = doar stare (punct + text).
   Text: 3 mărimi (14 / 16 / 22) + cifra mare (40). Greutăți: 400 și 600.
   Butoane: plin, contur, text. Toate au înălțimea minimă 44. Etichete: 1 tip. Carduri: 1 tip, fără umbră. */
:root{
  --bg:#f3f1ec;--card:#fbfaf7;--ink:#1b2433;--muted:#5b6473;--line:#d9d5ca;
  --ctl:#8a8474;--on-attn:#fff;--on-ok:#fff;--navy:#1f3a5f;--on-navy:#fff;--attn:#b93c08;--ok:#1a6d43;--warn:#8a6100;--bad:#b3261e;--idle:#6b7280;
  --f-head:'Archivo',system-ui,sans-serif;--f-body:'Barlow',system-ui,sans-serif;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--r:12px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#12161d;--card:#1a202a;--ink:#e9ecf2;--muted:#9aa4b5;--line:#2b3444;
  --ctl:#66738a;--on-attn:#0f1620;--on-ok:#0f1620;--navy:#8fb4f0;--on-navy:#0f1620;--attn:#f0894a;--ok:#5cc890;--warn:#e3b95a;--bad:#f28b82;--idle:#9aa4b5}}
:root[data-theme=dark]{
  --bg:#12161d;--card:#1a202a;--ink:#e9ecf2;--muted:#9aa4b5;--line:#2b3444;
  --ctl:#66738a;--on-attn:#0f1620;--on-ok:#0f1620;--navy:#8fb4f0;--on-navy:#0f1620;--attn:#f0894a;--ok:#5cc890;--warn:#e3b95a;--bad:#f28b82;--idle:#9aa4b5}
*{box-sizing:border-box}
html{color-scheme:light dark}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
#tema{min-width:44px;padding:0}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);font-weight:700;margin:0;letter-spacing:-.01em}
h1{font-size:22px;line-height:1.2}
h2{font-size:16px}
.meta{color:var(--muted);font-size:14px}
.num,.st,.sec-t .c,.citem .cm,.pj .rk,.rank,nav#nav .n{font-variant-numeric:tabular-nums}
.num{font-family:var(--f-head);font-weight:700}
#hb,#hf{min-width:44px;padding:0 var(--s2)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.f{fill:currentColor;stroke:none}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:48px;padding:0 var(--s4);border-radius:10px;border:1px solid var(--navy);background:var(--navy);color:var(--on-navy);font-weight:600;font-size:16px;cursor:pointer;text-align:center}
.btn.sec{background:transparent;color:var(--navy)}
.btn.txt{background:none;border-color:transparent;color:var(--muted);font-weight:400;padding:0 var(--s3);min-height:44px}
.btn.del{color:var(--bad)}
.btn.sm{min-height:44px;font-size:14px;padding:0 var(--s3)}
.btn:disabled{opacity:.5;cursor:default}
.btn:active:not(:disabled){transform:translateY(1px)}
.tag{display:inline-block;padding:0 var(--s2);border:1px solid var(--line);border-radius:6px;font-size:14px;color:var(--muted);white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--idle)}
.st.ok::before{background:var(--ok)}.st.warn::before{background:var(--warn)}.st.bad::before{background:var(--bad)}.st.attn::before{background:var(--attn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4)}
.stack{display:grid;gap:var(--s2)}
.grid{display:grid;gap:var(--s2)}
.grid>*,.stack>*{margin:0!important}
.sec-t{display:flex;align-items:baseline;gap:var(--s2);margin:var(--s5) 0 var(--s2)}
.sec-t .c{color:var(--muted);font-size:14px;font-weight:400}
.sec-t .l{margin-left:auto}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--s2);margin-top:var(--s3)}
.acts.tri{grid-template-columns:repeat(3,1fr)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:var(--s4);color:var(--muted)}
input[type=text],input[type=email],input[type=password],textarea,select{width:100%;min-height:48px;padding:10px var(--s3);border-radius:10px;border:1px solid var(--ctl);background:var(--card)}
textarea{min-height:120px;resize:vertical}
select{appearance:auto;font-weight:600}
details.card>summary{cursor:pointer;list-style:none;display:flex;gap:var(--s3);align-items:flex-start}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary .grow{flex:1;min-width:0}
details.card>summary::after{content:"";width:9px;height:9px;margin:8px 4px 0 0;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);flex:none;transition:transform .15s}
details.card[open]>summary::after{transform:rotate(-135deg);margin-top:12px}
details.card[open]>summary .clip{display:none}
.card .t{font-weight:600}
.fisa h3{font-size:14px;font-weight:600;color:var(--muted);margin:var(--s3) 0 var(--s1)}
.fisa p{margin:0}
.card pre,.card .body{white-space:pre-wrap;word-wrap:break-word;font:400 16px/1.5 var(--f-body);margin:var(--s3) 0 0;color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2);margin:var(--s3) 0}
.seg:has(>:nth-child(4):last-child),.seg:has(>:nth-child(2):last-child){grid-template-columns:repeat(2,minmax(0,1fr))}
.seg button{min-height:48px;padding:0 var(--s2);border-radius:10px;border:1px solid var(--ctl);background:var(--card);color:var(--ink);cursor:pointer;text-align:center;line-height:1.2}
.seg button.on{border-color:var(--navy);background:var(--navy);color:var(--on-navy);font-weight:600}
/* Chat: listă de conversații + conversația deschisă (pe telefon: pe rând) */
.chat{display:grid;gap:var(--s3)}
.clist{display:flex;flex-direction:column;gap:var(--s1)}
.citem{display:block;width:100%;text-align:left;padding:var(--s3);border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;color:var(--ink)}
.citem:hover{background:var(--card)}
.citem.on{background:var(--card);border-color:var(--navy)}
.citem .ct{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .cp{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.citem .cm{display:flex;justify-content:space-between;gap:var(--s2);font-size:14px;color:var(--muted);margin-top:2px}
.cgrp{font-size:14px;font-weight:600;color:var(--muted);margin:var(--s3) var(--s3) 0}
.cpane{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.chd{display:flex;align-items:center;gap:var(--s3);padding-bottom:var(--s3);border-bottom:1px solid var(--line)}
.chd .grow{flex:1;min-width:0}.chd h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmsgs{display:flex;flex-direction:column;gap:var(--s2)}
.cmp textarea{min-height:64px}
.chat .back{display:none}
@media(max-width:899px){.chat.open .clist{display:none}.chat:not(.open) .cpane{display:none}.chat .back{display:inline-flex}}
@media(min-width:900px){.chat{grid-template-columns:300px minmax(0,1fr);height:calc(100dvh - 200px)}.clist{overflow:auto;border-right:1px solid var(--line);padding-right:var(--s3)}.cpane{min-height:0}.cmsgs{flex:1;overflow:auto;padding-right:var(--s2)}}
.ask{margin-top:var(--s3);padding:var(--s3);border-radius:10px;border:1px solid var(--attn);white-space:pre-wrap}
.msg hr{border:0;border-top:1px solid var(--line);margin:var(--s3) 0}
.msg{max-width:88%;padding:var(--s3) var(--s4);border-radius:var(--r);white-space:pre-wrap;word-wrap:break-word}
.msg.eu{margin-left:auto;background:var(--navy);color:var(--on-navy);border-bottom-right-radius:4px}
.msg.jv{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .meta{margin-top:var(--s1)}.msg.eu .meta{color:var(--on-navy);opacity:.75}
.msg .who{font-size:14px;font-weight:600;color:var(--ok);margin-bottom:var(--s1)}
.rank{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:14px;background:var(--attn);color:var(--on-attn);font:700 14px var(--f-head);margin-right:var(--s2);vertical-align:middle}

#app{display:none}
#app.on{display:block}
#top{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--line);padding:var(--s2) var(--s4);padding-top:calc(var(--s2) + env(safe-area-inset-top))}
#top .r1{display:flex;align-items:center;gap:var(--s2);max-width:1200px;margin:0 auto}
#brand{display:none}
#ctx{flex:1;min-width:0;max-width:460px}
@media(max-width:599px){#top .r1{flex-wrap:wrap}#ctx{order:9;flex:1 1 100%;max-width:none}#pulse{margin-left:auto}}
#pulse{margin-left:auto}
#col{padding:var(--s4) var(--s4) 100px;max-width:1200px;margin:0 auto}
#head{margin:0 0 var(--s3)}
#head p{margin:var(--s1) 0 0}
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav#nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer}
nav#nav button.on{color:var(--navy);font-weight:600}
nav#nav button.on::before{content:"";position:absolute;top:0;left:20%;right:20%;height:3px;background:var(--navy);border-radius:0 0 3px 3px}
nav#nav .n{position:absolute;top:2px;left:calc(50% + 10px);min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--attn);color:var(--on-attn);font:700 14px/20px var(--f-head);text-align:center}
section{display:none}section.on{display:block}
@media(min-width:900px){
  #app.on{display:grid;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr}
  #top{grid-column:1/3;padding-left:0;padding-right:var(--s5)}
  #top .r1{max-width:none;margin:0}
  #brand{display:block;flex:none;width:244px;padding:0 var(--s4);font:700 22px var(--f-head)}
  nav#nav{position:sticky;top:61px;align-self:start;height:calc(100dvh - 61px);grid-template-columns:1fr!important;grid-auto-rows:min-content;border-top:0;border-right:1px solid var(--line);padding:var(--s3)}
  nav#nav button{flex-direction:row;justify-content:flex-start;gap:var(--s3);min-height:44px;padding:0 var(--s3);border-radius:10px;font-size:16px}
  nav#nav button.on{background:var(--line);color:var(--ink)}nav#nav button.on::before{display:none}
  nav#nav .n{position:static;margin-left:auto}
  #col{padding:var(--s5) 32px 48px;margin:0;max-width:none;min-width:0}
  #col>*{max-width:1500px}
  .grid.g2{grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}
  .grid.g2>:last-child:nth-child(odd){grid-column:1/-1}
}
.kpi4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2);margin:0 0 var(--s4)}
.kpi4 button{display:block;text-align:left;padding:var(--s3);border:1px solid var(--line);border-radius:var(--r);background:none;color:var(--ink);cursor:pointer;font:inherit}
.kpi4 .n{display:block;font:700 26px/1.1 var(--f-head);font-variant-numeric:tabular-nums}
.kpi4 .l{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.kpi4 button.hot .n{color:var(--attn)}
svg.spark{vertical-align:middle;color:var(--muted);margin-left:var(--s2)}
.hero{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap}
.hero .big{font-size:40px;line-height:1}
.hero .big.attn{color:var(--attn)}
.hero .tx{flex:1;min-width:180px}
/* REGISTRU: singurul tipar de listă cu coloane. Antet + rânduri pe același grid (--cols); rândul care duce undeva e buton și are › în ultima coloană. */
.reg{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.reg-h,.reg-r{display:grid;grid-template-columns:var(--cols) 24px;gap:var(--s3);align-items:center;padding:var(--s3) var(--s4)}
.reg-h{font-size:14px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.reg-r{width:100%;min-height:56px;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);font:inherit}
.reg-h+.reg-r{border-top:0}
button.reg-r{cursor:pointer}button.reg-r:hover{background:var(--bg)}
.reg-r .rc{min-width:0}.reg-r .t{font-weight:600}.reg-r .go{color:var(--muted);text-align:right}
.card .reg{border:0;border-radius:0;background:none;margin:var(--s2) calc(var(--s4) * -1) calc(var(--s4) * -1)}
.reg-g{padding:var(--s2) var(--s4);background:var(--bg);font-weight:600;color:var(--muted);border-top:1px solid var(--line)}
.reg .rk{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font:700 14px var(--f-head);color:var(--muted)}
.reg .rk.top{background:var(--attn);border-color:var(--attn);color:var(--on-attn)}
@media(max-width:599px){.reg-h{display:none}.reg-r{grid-template-columns:1fr 24px;gap:var(--s1) var(--s3)}.reg-r .rc:not(.go){grid-column:1}.reg-r .go{grid-column:2;grid-row:1}}
.rec{display:grid;grid-template-columns:1fr;gap:var(--s3)}
.rec .rk{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--attn);color:var(--on-attn);font:700 14px var(--f-head)}
.rec .why{margin:var(--s2) 0 0}
.rec .next{margin:var(--s2) 0 0;font-weight:600}
.ctxhead{display:flex;gap:var(--s3);align-items:flex-start;flex-wrap:wrap}
.ctxhead .grow{flex:1;min-width:220px}
.tl{position:relative;margin:0;padding:0;list-style:none}
.tl li{position:relative;padding:0 0 var(--s4) var(--s5)}
.tl li::before{content:"";position:absolute;left:5px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--line);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.tl li::after{content:"";position:absolute;left:9px;top:20px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.ad::before{background:var(--navy)}.tl li.jv::before{background:var(--ok)}
.tl .d{color:var(--muted);font-size:14px;margin:var(--s3) 0 var(--s2);font-weight:600}
.tl li.dl{padding:0}.tl li.dl::before,.tl li.dl::after{display:none}
.lev{display:flex;align-items:center;gap:var(--s3);padding:10px 0;border-top:1px solid var(--line)}
.lev:first-child{border-top:0}
.lev .tick{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);color:transparent;flex:none}
.lev.y .tick{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.lev .tick svg{width:13px;height:13px}
.lev span{flex:1}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.st9{display:grid;grid-template-columns:32px 1fr;gap:var(--s3);padding:0 0 var(--s4);position:relative}
.st9::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line)}
.st9:last-child::before{display:none}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--bg);font:700 14px var(--f-head);color:var(--muted)}
.st9.done .dot{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.st9.partial .dot{border-color:var(--warn);color:var(--warn)}
.st9.now .dot{background:var(--attn);border-color:var(--attn);color:var(--on-attn)}
.st9 .t{font-family:var(--f-head);font-weight:600}
.flow .fl{display:grid;grid-template-columns:32px 1fr;gap:var(--s3);position:relative;padding-bottom:var(--s4)}
.flow .fl::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line)}
.flow .fl:last-child::before{display:none}
.flow .fl .dot{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.flow .fl.you .dot{background:var(--attn);border-color:var(--attn);color:var(--on-attn)}
.who{display:grid;gap:var(--s2);margin-top:var(--s2)}
.who button{display:flex;align-items:center;gap:var(--s3);text-align:left;padding:var(--s3);border-radius:10px;border:1px solid var(--ctl);background:var(--card);cursor:pointer;min-height:48px}
.who button .num{font-size:22px;min-width:34px}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s2);margin-top:var(--s3)}
.qa button{min-height:52px;padding:var(--s2) var(--s3);border-radius:10px;border:1px solid var(--ctl);background:var(--card);cursor:pointer;text-align:left;line-height:1.25}
.qa button b{display:block;font-weight:600}
.lbl{display:flex;align-items:center;gap:var(--s3);justify-content:space-between}
.ans{margin-top:var(--s3);padding:var(--s3);border-radius:10px;background:var(--bg);white-space:pre-wrap;word-wrap:break-word}
.toast{position:fixed;left:var(--s4);right:var(--s4);bottom:76px;z-index:9;background:var(--ink);color:var(--bg);padding:var(--s3) var(--s4);border-radius:10px;display:none}
@media(min-width:900px){.toast{left:auto;right:24px;bottom:24px;width:360px}}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);padding:0;width:min(640px,calc(100vw - 32px));max-height:85dvh}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dh{display:flex;align-items:center;gap:var(--s3);padding:var(--s4);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
dialog .dh h2{flex:1}
dialog .db{padding:var(--s4)}
#login{margin:12vh auto 0;width:min(340px,90vw);display:grid;gap:var(--s3)}
</style>
</head>
<body>
<div id="login">
  <h1>Jarvis · TechFlow</h1>
  <input id="em" type="email" placeholder="Email" autocomplete="username" value="adrian@techflowtm.ro" aria-label="Email">
  <input id="pw" type="password" placeholder="Parolă" autocomplete="current-password" aria-label="Parolă">
  <button class="btn" id="go">Intră</button>
  <small id="err" style="color:var(--bad)"></small>
</div>

<div id="app">
  <div id="top"><div class="r1">
    <span id="brand">Jarvis · TechFlow</span>
    <button class="btn sec sm" id="hb" aria-label="Înapoi" title="Înapoi">‹</button><button class="btn sec sm" id="hf" aria-label="Înainte" title="Înainte">›</button><button class="btn sec sm" id="back" aria-label="Acasă">Acasă</button>
    <select id="ctx" aria-label="Proiect"></select>
    <span id="pulse" class="st"><span>runner</span></span>
    <button class="btn sec sm" id="tema" aria-label="Temă: auto, luminos, întunecat" title="Temă"></button><button class="btn txt sm" id="out">Ieși</button>
  </div></div>
  <nav id="nav" aria-label="Ecrane"></nav>
  <div id="col">
    <div id="head"><h1 id="h1"></h1><p class="meta" id="h1p"></p></div>
    <main>
      <section id="s-acasa"></section>
      <section id="s-stadiu"></section>
      <section id="s-chat"><div class="chat" id="chat"><aside class="clist" id="clist"></aside><div class="cpane"><div id="chead"></div><div id="thr" class="cmsgs"></div><div id="cmp"></div></div></div></section>
      <section id="s-decis"></section>
      <section id="s-avem"></section>
      <section id="s-drum"></section>
      <section id="s-harta"></section>
    </main>
  </div>
</div>

let ultimTrimis = {t:'',ts:0};
async function trimite(text, mod){
  if (text===ultimTrimis.t && Date.now()-ultimTrimis.ts<60000) return toast('Ai trimis deja exact asta. Aștept răspunsul.');
  ultimTrimis = {t:text,ts:Date.now()};
  const t = thread;
  // continui o conversație deschisă: aceeași sesiune Claude, care ține minte singură
  if (t && ['conv','proiect'].includes(t.tip)) {
    const c = await cere(text,{sursa:'telefon',interp:{thread:tkey(t),proiect:t.proiect||(ctx!=='acasa'?ctx:null),mesaj:text}}); if (!c) return;
    await db.from('mesaje').insert({autor:'adrian',text,cerere_id:c.id});
    toast(runnerOn()?'Trimis.':'Trimis. Calculatorul e oprit: așteaptă în coadă.'); return load();
  }
  const brut = t ? `DISCUȚIE despre ${t.titlu}.\n\nContext:\n${(t.det||'').slice(0,1500)}${istoric()}\n\nAdrian: ${text}\n\n${mod==='apuca'?'Adrian a spus să te apuci: execută ce s-a stabilit în discuție, cât e reversibil.':'Răspunde ca partener de discuție: întreabă, opinează ferm, propune. Nu executa nimic și nu începe lucrul până nu spune „apucă-te”.'}`
    : (/^\s*c[âa]t sunt plecat/i.test(text) ? `MOD AUTONOM: ${text}` : text);
  const interp = t ? {thread:tkey(t),item_tip:t.tip,item_id:t.id,proiect:t.proiect,mesaj:text} : (/^\s*c[âa]t sunt plecat/i.test(text) ? {mod:'autonom',mesaj:text} : {mesaj:text});
  const c = await cere(brut,{sursa:'telefon',interp}); if (!c) return;
  await db.from('mesaje').insert({autor:'adrian',text,cerere_id:c.id});
  if (!t) { thread = {tip:'conv',id:c.id,titlu:text.slice(0,70),proiect:cerP(c)}; chatNou = false; }   // conversația nouă rămâne deschisă
  rComp();
  toast(runnerOn()?'Trimis.':'Trimis. Calculatorul e oprit: așteaptă în coadă.'); load();
}
